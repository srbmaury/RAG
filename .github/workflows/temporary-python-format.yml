name: Temporary Python style fix
on:
  push:
    branches: [codex/repository-code-style]
    paths: ['.github/workflows/temporary-python-format.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/repository-code-style
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fix Ruff imports and formatting
        run: |
          pip install ruff
          ruff check --fix backend evals ops load_tests
          ruff format backend evals ops load_tests
          ruff check backend evals ops load_tests
          ruff format --check backend evals ops load_tests
      - name: Commit fixes to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend evals ops load_tests
          if ! git diff --cached --quiet; then
            git commit -m "style(backend): sort imports and format OAuth alias changes"
            git push origin HEAD:codex/repository-code-style
          fi
